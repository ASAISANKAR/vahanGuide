services:
  postgres:
    image: postgres:16-alpine
    container_name: vahanguide-postgres
    environment:
      POSTGRES_DB: vahanguide
      POSTGRES_USER: vahanguide
      POSTGRES_PASSWORD: vahanguide_dev
    ports:
      - "5432:5432"
    volumes:
      - vahanguide_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vahanguide -d vahanguide"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vahanguide_pgdata:
