spring:
  application:
    name: vahanguide-api
  datasource:
    url: jdbc:postgresql://localhost:5432/vahanguide
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
server:
  port: ${PORT:8080}
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
